
# ---------- Application ----------
spring.application.name=movie-review
server.port=8080

# ---------- Database (XAMPP MySQL) ----------
spring.datasource.url=jdbc:mysql://localhost:3306/movie_review_db?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=Asia/Kolkata
spring.datasource.username=root
spring.datasource.password=

# ---------- JPA / Hibernate ----------
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQL8Dialect

# ---------- JSON ----------
spring.jackson.serialization.write-dates-as-timestamps=false

# ---------- Swagger ----------
springdoc.swagger-ui.path=/swagger-ui.html

# ---------- Logging ----------
logging.level.root=INFO
logging.level.com.movieapp=DEBUG

spring.data.web.pageable.default-page-size=10
spring.data.web.pageable.max-page-size=50

# ---------- JWT ----------
jwt.secret=ThisIsASecretKeyForMovieReviewAppChangeItLater123456
jwt.expiration-ms=86400000